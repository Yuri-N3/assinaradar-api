services:
  analytics:
    build: ../assinaradar-analytics
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build: .
    environment:
      DATABASE_PATH: /app/data/assinaradar.db
      ANALYTICS_URL: http://analytics:8001
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - assinaradar_data:/app/data
    depends_on:
      analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  assinaradar_data:
